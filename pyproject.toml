[project]
name = "heng-erp"
version = "0.1.0"
description = "HengERP - AI-native open-core ERP (M0 skeleton)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0.30",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/contracts", "packages/kernel", "packages/semantic", "packages/actions", "packages/agent", "packages/llm", "packages/eval", "apps/api"]
include = ["heng_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
