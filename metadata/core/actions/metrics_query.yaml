action: metrics.query
version: 1
label: 指标查询(语义编译)
description: 按指标注册中心口径查询经营数字，返回口径说明与单据下钻
handler: metrics_query
input_schema:
  type: object
  required: [metric]
  additionalProperties: false
  properties:
    metric: { type: string, enum: [revenue] }
    filters:
      type: object
      additionalProperties: false
      properties:
        region: { type: string }
        period: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
preconditions: []
effects: []
risk_level: low
scopes: [metrics.read]
automation: { max_level: L3 }
evals: []
compensation: null
