action: finance.journal.post
version: 1
label: 手工凭证过账
description: 借贷平衡校验通过后过账
handler: finance_journal_post
input_schema:
  type: object
  required: [period, lines]
  additionalProperties: false
  properties:
    period: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
    doc_ref: { type: string }
    lines:
      type: array
      minItems: 2
      items:
        type: object
        required: [account_id]
        properties:
          account_id: { type: string }
          debit: { type: number, minimum: 0, default: 0 }
          credit: { type: number, minimum: 0, default: 0 }
          partner_id: { type: string }
preconditions:
  - "balanced(lines)"
effects:
  - creates: journal.entry
risk_level: high
scopes: [finance.journal.write]
automation: { max_level: L1 }
evals: [evals/finance/journal_balance.yaml]
compensation: null
