id: agent-offline-degradation-001
agent: order_clerk
given: { fixture: demo_trading_cn }
when:
  channel: copilot
  utterance: "给华东李总发200台A100，按上次的价格，含税"
then:
  deterministic:
    - 'run.model.model_id == "rule-template-v1"'
    - "action_called: sales.order.create"
    - 'status == "pending_approval"'
    - "no_action_executed: [sales.order.create]"
